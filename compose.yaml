services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .postgres.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - khrufai_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  khrufai_pgdata:
